<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="heading"><span class="mark" aria-hidden="true">▦</span><div><h1>Papka guruhlari</h1><small id="summary">1 ta guruh</small></div></div>
    <div class="header-actions">
      <button id="quick-add-group" class="icon-button" type="button" data-no-drag aria-label="Yangi guruh" title="Yangi guruh">+</button>
      <button id="edit" class="icon-button" type="button" data-no-drag aria-label="Guruhlarni sozlash" title="Guruhlarni sozlash">✎</button>
    </div>
  </header>
  <div id="toolbar" class="toolbar" hidden data-no-drag>
    <button id="add-group" type="button">+ Yangi guruh</button>
    <label class="neon-toggle"><input id="neon-motion" type="checkbox" checked> Neon harakati</label>
  </div>
  <main id="groups" class="groups" aria-label="Papka guruhlari"></main>
  <div id="no-groups" class="no-groups" hidden>Hali guruh yo‘q. ✎ tugmasi orqali yangi guruh yarating.</div>
  <div class="drop" id="drop">Papkani guruh ustiga qo‘yib yuboring</div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <script src="main.js"></script>
</body>
</html>
