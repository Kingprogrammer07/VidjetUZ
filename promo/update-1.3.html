<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>FullWidget 1.3 cover</title>
  <!-- The 1.3 update cover (Simplified Chinese, 1920×1080): the same dark widget wall as cover.html,
       with the new lyrics card as the hero. The widget pictures are real widgets with made-up
       content (assets/update-1.3/). Render: msedge --headless --screenshot, see promo/README.md. -->
  <link rel="stylesheet" href="promo.css">
  <style>
    html, body { margin: 0; background: var(--dark); overflow: hidden; }
    #c { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--dark); }

    /* the wall of real widgets, dimmed, behind everything */
    .wall { position: absolute; inset: -80px -60px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 24px; transform: rotate(-8deg) scale(1.1); transform-origin: 60% 50%; opacity: 0.38; }
    .wall div { padding: 16px; border-radius: 22px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07); background: rgba(255, 255, 255, 0.03); }
    .wall img { width: 100%; height: auto; display: block; }
    .shade { position: absolute; inset: 0; background:
      radial-gradient(60% 70% at 72% 46%, rgba(125, 226, 196, 0.16), transparent 70%),
      linear-gradient(90deg, rgba(14, 16, 19, 0.98) 0%, rgba(14, 16, 19, 0.93) 40%, rgba(14, 16, 19, 0.72) 62%, rgba(14, 16, 19, 0.6) 100%); }

    .brand { position: absolute; left: 116px; top: 104px; display: flex; align-items: center; gap: 20px; font: 700 50px/1 var(--display); letter-spacing: -0.03em; color: #fff; }
    .brand img { width: 68px; height: 68px; }

    .h { position: absolute; left: 106px; top: 236px; font: 800 236px/0.9 var(--display); letter-spacing: -0.05em; color: #fff; white-space: nowrap; }
    .h em { font-style: normal; background: linear-gradient(90deg, #4cc9f0, #9b5de5 50%, #f2b45c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .h small { font-size: 112px; letter-spacing: -0.02em; margin-left: 18px; }

    .s { position: absolute; left: 116px; top: 500px; font: 600 46px/1.3 var(--sans); color: var(--on-dark); }

    .list { position: absolute; left: 116px; top: 600px; display: grid; grid-template-columns: auto auto; gap: 18px 18px; }
    .list b { font: 700 36px/1 var(--sans); padding: 20px 30px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); white-space: nowrap; }

    .mem { position: absolute; left: 116px; top: 836px; display: flex; align-items: center; gap: 22px; padding: 22px 34px 22px 30px; border-radius: 26px; background: var(--mint); color: #0b1512; }
    .mem .t { font: 800 40px/1 var(--sans); }
    .mem .n { font: 700 36px/1 var(--mono); letter-spacing: -0.02em; display: flex; align-items: center; gap: 14px; }
    .mem .n s { text-decoration-thickness: 3px; opacity: 0.55; }

    /* the hero: the lyrics card */
    .hero { position: absolute; left: 1010px; top: 170px; width: 820px; border-radius: 37px; background: #24272c; box-shadow: 0 60px 90px -30px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06); transform: rotate(-2deg); }
    .hero img { width: 100%; display: block; border-radius: 37px; }
    .tag { position: absolute; font: 700 30px/1 var(--sans); color: #0b1512; background: #fff; padding: 14px 22px; border-radius: 999px; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5); white-space: nowrap; }
    .tag.ly { left: 1480px; top: 112px; transform: rotate(3deg); }

    /* the note, called up with a shortcut */
    .note { position: absolute; left: 1180px; top: 720px; width: 450px; border-radius: 34px; background: #24272c; box-shadow: 0 50px 80px -24px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.06); transform: rotate(3deg); }
    .note img { width: 100%; display: block; border-radius: 34px; }
    .keys { position: absolute; left: 1080px; top: 668px; z-index: 2; display: flex; gap: 12px; transform: rotate(-4deg); }
    .keys kbd { font: 700 34px/1 var(--sans); min-width: 70px; text-align: center; padding: 20px 22px 24px; border-radius: 16px; color: #fff; background: linear-gradient(#3a4049, #262a31); box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.35), inset 0 0 0 1.5px rgba(255, 255, 255, 0.16), 0 18px 30px -10px rgba(0, 0, 0, 0.7); }
    .keys i { font: 700 30px/72px var(--sans); color: var(--on-dark-muted); font-style: normal; }
  </style>
</head>
<body>
  <div id="c">
    <div class="wall" id="wall"></div>
    <div class="shade"></div>

    <div class="brand"><img src="../build/logo/logo.svg" alt="">FullWidget</div>
    <div class="h"><em>1.3</em><small>更新了</small></div>
    <div class="s">免费、开源的 Windows 11 桌面小组件</div>
    <div class="list"><b>🎵 歌词同步显示</b><b>⌨️ 全局快捷键</b><b>💱 中行汇率</b><b>⬆️ 软件内更新</b></div>
    <div class="mem"><span class="t">内存减半</span><span class="n"><s>240</s>→ 120 MB</span></div>

    <div class="hero"><img src="assets/update-1.3/media-lyrics.png" alt=""></div>
    <div class="tag ly">网易云 · QQ音乐 · 酷狗</div>
    <div class="note"><img src="assets/update-1.3/notes.png" alt=""></div>
    <div class="keys"><kbd>Ctrl</kbd><i>+</i><kbd>Alt</kbd><i>+</i><kbd>N</kbd></div>
  </div>
  <script>
    const wall = document.getElementById("wall");
    ["clock", "weather", "sysinfo", "calendar", "todo", "flipclock", "forecast", "usage", "pomodoro", "currency", "analogclock",
      "netspeed", "worldclock", "habits", "airquality", "whitenoise", "calculator", "timer", "rss", "sunmoon", "countdown",
      "disks", "pcinfo", "battery", "progress", "dailyimage", "onthisday", "photoframe"]
      .forEach((f) => { const d = document.createElement("div"); d.innerHTML = `<img src="../site/assets/widgets/${f}/instrument.zh-CN.webp" onerror="this.parentNode.remove()">`; wall.append(d); });
  </script>
</body>
</html>
