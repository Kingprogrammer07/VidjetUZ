<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>FullWidget 1.4 cover</title>
  <!-- The 1.4 update cover (Simplified Chinese): the same dark widget wall as update-1.3.html, with
       plugins as the hero: the real performance monitor widget (market/widgets/hmgvibe.perf-monitor),
       fed by a made-up plugin, over the game from the video, and the two lines of code that use it.
       update-1.4.html?ar=16x9|4x3 (1920×1080 or 1440×1080).
       Render: node promo/render.mjs --cover update-1.4.html → promo/out/update-1.4-cover-<ar>.zh-CN.jpg -->
  <link rel="stylesheet" href="promo.css">
  <style>
    html, body { margin: 0; background: var(--dark); overflow: hidden; }
    #c { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--dark); --line: rgba(255, 255, 255, 0.09); }
    .r43 #c { width: 1440px; }

    /* the wall of real widgets, dimmed, behind everything */
    .wall { position: absolute; inset: -80px -60px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 24px; transform: rotate(-8deg) scale(1.1); transform-origin: 60% 50%; opacity: 0.34; }
    .r43 .wall { grid-template-columns: repeat(6, 1fr); }
    .wall div { padding: 16px; border-radius: 22px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07); background: rgba(255, 255, 255, 0.03); }
    .wall img { width: 100%; height: auto; display: block; }
    .shade { position: absolute; inset: 0; background:
      radial-gradient(55% 65% at 74% 50%, rgba(242, 154, 92, 0.13), transparent 70%),
      linear-gradient(90deg, rgba(14, 16, 19, 0.98) 0%, rgba(14, 16, 19, 0.93) 40%, rgba(14, 16, 19, 0.74) 62%, rgba(14, 16, 19, 0.62) 100%); }

    .brand { position: absolute; left: 116px; top: 104px; display: flex; align-items: center; gap: 20px; font: 700 50px/1 var(--display); letter-spacing: -0.03em; color: #fff; }
    .brand img { width: 68px; height: 68px; }

    .h { position: absolute; left: 106px; top: 236px; font: 800 236px/0.9 var(--display); letter-spacing: -0.05em; color: #fff; white-space: nowrap; }
    .h em { font-style: normal; background: linear-gradient(90deg, #4cc9f0, #9b5de5 50%, #f2b45c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .h small { font-size: 112px; letter-spacing: -0.02em; margin-left: 18px; }

    .s { position: absolute; left: 116px; top: 500px; font: 600 46px/1.3 var(--sans); color: var(--on-dark); white-space: nowrap; }

    .list { position: absolute; left: 116px; top: 600px; display: grid; grid-template-columns: auto auto; gap: 18px 18px; }
    .list b { font: 700 36px/1 var(--sans); padding: 20px 30px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14); white-space: nowrap; }
    .list b.hot { background: #b69cff; color: #140f22; box-shadow: none; }

    .mem { position: absolute; left: 116px; top: 836px; padding: 24px 34px; border-radius: 26px; background: var(--mint); color: #0b1512; font: 800 40px/1 var(--sans); white-space: nowrap; }

    /* the hero: a game, the performance monitor over it */
    .scene { position: absolute; left: 990px; top: 150px; width: 860px; height: 590px; border-radius: 34px; overflow: hidden; transform: rotate(-2.5deg);
      background: linear-gradient(#120d33 0%, #3b1f62 34%, #b0507a 54%, #f29a5c 62%, #191426 62.2%, #0c0a14 100%);
      box-shadow: 0 60px 90px -30px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08); }
    .scene .sun { position: absolute; left: 50%; top: 40%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; background: radial-gradient(circle, #ffe2a8 0 45%, rgba(255, 190, 120, 0.5) 46%, transparent 70%); clip-path: inset(0 0 46% 0); }
    .scene .hills { position: absolute; left: 0; right: 0; top: 48%; height: 15%; background: #2a1638; clip-path: polygon(0 100%, 0 60%, 12% 30%, 24% 55%, 38% 20%, 50% 50%, 63% 15%, 78% 52%, 90% 28%, 100% 50%, 100% 100%); opacity: 0.9; }
    .scene .road { position: absolute; inset: 0; clip-path: polygon(48% 62%, 52% 62%, 96% 100%, 4% 100%); background: linear-gradient(#1c1828, #2a2536); }
    .scene .road i { position: absolute; left: 50%; transform: translateX(-50%); background: #f5d68a; border-radius: 2px; }

    .pw { position: absolute; left: 1210px; top: 450px; width: 620px; height: 357px; transform: rotate(2deg); filter: drop-shadow(0 40px 50px rgba(0, 0, 0, 0.6)); }
    .pw::before { content: ""; position: absolute; inset: 1px; border-radius: 24px; background: #1c2027; }
    .pw iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; color-scheme: dark; }

    .ribbon { position: absolute; left: 1430px; top: 98px; font: 700 30px/1 var(--sans); color: #0b1512; background: #fff; padding: 14px 22px; border-radius: 999px; box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5); white-space: nowrap; transform: rotate(3deg); }
    .ribbon i { font-style: normal; color: #a0602a; }

    /* the code that uses the plugin */
    .snip { position: absolute; left: 930px; top: 872px; padding: 22px 32px; border-radius: 24px; background: #0f1217; transform: rotate(-1.5deg); z-index: 2;
      box-shadow: inset 0 0 0 1.5px rgba(182, 156, 255, 0.4), 0 40px 60px -20px rgba(0, 0, 0, 0.85); font: 28px/1.6 var(--mono); color: #d7dde4; white-space: pre; }
    .snip .kw { color: #c792ea; } .snip .st { color: #a5e07a; } .snip .fn { color: #7dc8ff; }

    /* 4:3: the words on the left, the hero below right, the code above it */
    .r43 .brand { left: 84px; top: 76px; }
    .r43 .h { left: 76px; top: 190px; font-size: 210px; }
    .r43 .h small { font-size: 100px; }
    .r43 .s { left: 86px; top: 424px; font-size: 40px; }
    .r43 .list { left: 86px; top: 530px; grid-template-columns: auto; gap: 16px; }
    .r43 .list b { font-size: 32px; padding: 18px 26px; justify-self: start; }
    .r43 .mem { left: 86px; top: 920px; font-size: 36px; padding: 22px 30px; }
    .r43 .ribbon { left: 1010px; top: 70px; font-size: 26px; }
    .r43 .snip { left: 740px; top: 180px; font-size: 22px; padding: 20px 28px; transform: rotate(-2deg); }
    .r43 .scene { left: 760px; top: 520px; width: 620px; height: 400px; }
    .r43 .pw { left: 870px; top: 700px; width: 500px; height: 288px; }
  </style>
</head>
<body>
  <div id="c">
    <div class="wall" id="wall"></div>
    <div class="shade"></div>

    <div class="brand"><img src="../build/logo/logo.svg" alt="">FullWidget</div>
    <div class="h"><em>1.4</em><small>更新了</small></div>
    <div class="s">免费、开源的 Windows 11 桌面小组件</div>
    <div class="list"><b class="hot">🧩 扩展插件</b><b>⌨️ 执行命令</b><b>📊 官方插件</b><b>🔔 组件更新提醒</b></div>
    <div class="mem">组件能做的事，不用再等更新</div>

    <div class="scene"><div class="sun"></div><div class="hills"></div><div class="road"><i></i><i></i><i></i><i></i></div></div>
    <div class="pw"><iframe id="perf" scrolling="no"></iframe></div>
    <div class="ribbon">官方插件 · <i>性能数据</i></div>
    <div class="snip"><span class="kw">const</span> perf = widget.<span class="fn">plugin</span>(<span class="st">"fullwidget.perf"</span>);
perf.<span class="fn">on</span>(<span class="st">"stats"</span>, show);</div>
  </div>
  <script>window.__errs = []; addEventListener("error", (e) => window.__errs.push(`${e.message} (${(e.filename || "").split("/").pop()}:${e.lineno})`));</script>
  <script>window.COPY = { lang: "zh-CN", media: { title: "", artist: "", album: "" }, device: "" };</script>
  <script src="../site/widget-host.js"></script>
  <script src="live.js"></script>
  <script>
    if (new URLSearchParams(location.search).get("ar") === "4x3") document.documentElement.classList.add("r43");

    const wall = document.getElementById("wall");
    ["clock", "weather", "sysinfo", "calendar", "todo", "flipclock", "forecast", "usage", "pomodoro", "currency", "analogclock",
      "netspeed", "worldclock", "habits", "airquality", "whitenoise", "calculator", "timer", "rss", "sunmoon", "countdown",
      "disks", "pcinfo", "battery", "progress", "dailyimage", "onthisday", "photoframe"]
      .forEach((f) => { const d = document.createElement("div"); d.innerHTML = `<img src="../site/assets/widgets/${f}/instrument.zh-CN.webp" onerror="this.parentNode.remove()">`; wall.append(d); });

    // the road's stripes, as they are in one frame of the video
    document.querySelectorAll(".road i").forEach((s, i) => {
      const z = (0.35 + i / 4) % 1;
      Object.assign(s.style, { top: `${62 + 38 * z * z}%`, width: `${0.25 + 1.4 * z * z}%`, height: `${0.8 + 9 * z * z}%`, opacity: 0.25 + 0.6 * z });
    });

    // the performance monitor, live, fed by a made-up plugin (the same one as the video's)
    const GB = 2 ** 30;
    const perfAt = (vt) => {
      const s = (vt - Live.BASE) / 1000;
      return {
        time: vt,
        gpus: [{ name: "GeForce RTX", util: Math.round(86 + 3 * Math.sin(s * 0.8)), vramUsed: 4.6 * GB, vramTotal: 6 * GB, sharedUsed: 0, temp: 71, power: 92, clock: 1702 }],
        fps: { state: "ok", value: 144, process: "game", title: "" },
      };
    };
    const images = Promise.all([...document.images].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })));
    window.PROMO_ASSET = images.then(() => Live.mount(document.getElementById("perf"), {
      folder: "../market/widgets/hmgvibe.perf-monitor", t0: 0, plugin: perfAt,
      script: "history.length = 0; for (let i = 0; i < 54; i++) history.push(Math.round(140 + 7 * Math.sin(i / 3.5) + 4 * Math.sin(i / 1.4) - (i > 36 && i < 41 ? 30 : 0)));",
    })).then(async (w) => {
      for (let t = 0; t <= 4; t += 0.5) { w.sync(t); await new Promise((r) => setTimeout(r, 30)); }
      await document.fonts.ready;
      await new Promise((r) => setTimeout(r, 400));
      return true;
    });
  </script>
</body>
</html>
